# gcloud builds submit --config infra/cloudbuild.yaml --substitutions=_TAG=$(git rev-parse --short HEAD)
# (_TAG must match the TAG given to infra/deploy.sh; $SHORT_SHA is empty outside triggers)
substitutions:
  _REGION: asia-south1
  _REPO: vendorlink
  _TAG: dev
steps:
  - id: test
    name: ghcr.io/astral-sh/uv:0.8.22-python3.12-bookworm-slim
    entrypoint: sh
    args: ["-c", "uv sync --frozen && uv run ruff check . && uv run mypy && uv run pytest -q"]
  - id: build
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        for svc in trust_gateway vendor_svc retailer_svc mocks; do
          name=$${svc//_/-}
          docker build --build-arg SERVICE=$$svc -f infra/Dockerfile \
            -t ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/$$name:${_TAG} . || exit 1
          docker push ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/$$name:${_TAG} || exit 1
        done
        # The Slack MCP server the deployed Liaison calls over HTTP (infra/slack_mcp).
        docker build -f infra/slack_mcp/Dockerfile \
          -t ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/slack-mcp:${_TAG} infra/slack_mcp || exit 1
        docker push ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/slack-mcp:${_TAG} || exit 1
options:
  logging: CLOUD_LOGGING_ONLY
