# Every push and PR: lint, types, tests, the API journey, the order loop and both attacks
# (CLAUDE.md "Testing expectations"), plus the web build and a schema-drift check.
name: ci
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  VL_STORE: memory
  VL_CHECKPOINTS: memory
  VL_CHANNELS: local

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
          enable-cache: true
      - run: uv sync --frozen
      - name: lint · types · tests
        run: make check
      - name: specialist evals (no model keys in CI, so the offline paths)
        run: make evals
      - name: agents and configs validate
        run: uv run python -m agents validate
      - name: every route exercised
        run: make api-check
      - name: order loop (green / amber / red)
        run: make e2e
      - name: attacks must be blocked
        run: make attacks

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv sync --frozen
      - run: cd web && npm ci
      - name: schemas and generated types are up to date
        run: |
          make schemas
          git diff --exit-code -- web/src || {
            echo "::error::run 'make schemas' and commit the result"; exit 1; }
      - name: typecheck and build
        run: make web-check
